name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache pinned dependencies
        uses: actions/cache@v4
        with:
          path: .cache/waypoint-deps
          key: ${{ runner.os }}-waypoint-deps-${{ hashFiles('external/dependencies.lock.json') }}
          restore-keys: ${{ runner.os }}-waypoint-deps-

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Configure core
        run: >-
          cmake -S . -B build/core -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.cache/waypoint-deps
          -DWAYPOINT_BUILD_RUNTIME=OFF
          -DWAYPOINT_ENABLE_RENDER=OFF
          -DWAYPOINT_ENABLE_PHYSICS=ON
          -DWAYPOINT_ENABLE_SCRIPTING=ON
          -DWAYPOINT_BUILD_EDITOR=OFF
          -DWAYPOINT_BUILD_TESTS=ON

      - name: Build core
        run: cmake --build build/core --parallel

      - name: Test core
        run: ctest --test-dir build/core --output-on-failure

  desktop-runtime:
    name: Desktop runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache pinned dependencies
        uses: actions/cache@v4
        with:
          path: .cache/waypoint-deps
          key: ${{ runner.os }}-waypoint-deps-${{ hashFiles('external/dependencies.lock.json') }}
          restore-keys: ${{ runner.os }}-waypoint-deps-

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y ninja-build
          libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev
          libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libvulkan-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Configure runtime
        run: >-
          cmake -S . -B build/runtime -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.cache/waypoint-deps
          -DWAYPOINT_BUILD_RUNTIME=ON
          -DWAYPOINT_ENABLE_RENDER=ON
          -DWAYPOINT_ENABLE_PHYSICS=ON
          -DWAYPOINT_ENABLE_SCRIPTING=ON
          -DWAYPOINT_BUILD_EDITOR=OFF
          -DWAYPOINT_BUILD_TESTS=ON
          -DWAYPOINT_BUILD_BGFX_TOOLS=ON

      - name: Build runtime
        run: cmake --build build/runtime --parallel

      - name: Test runtime build
        run: ctest --test-dir build/runtime --output-on-failure

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: waypoint-runtime-${{ matrix.os }}
          path: build/runtime/runtime/
