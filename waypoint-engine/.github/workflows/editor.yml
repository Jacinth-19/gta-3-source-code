name: Editor

on:
  workflow_dispatch:

jobs:
  qt-editor:
    name: Qt editor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache pinned dependencies
        uses: actions/cache@v4
        with:
          path: .cache/waypoint-deps
          key: ${{ runner.os }}-waypoint-deps-${{ hashFiles('external/dependencies.lock.json') }}
          restore-keys: ${{ runner.os }}-waypoint-deps-

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          cache: true

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y ninja-build
          libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev
          libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libvulkan-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Configure editor
        run: >-
          cmake -S . -B build/editor -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.cache/waypoint-deps
          -DWAYPOINT_BUILD_EDITOR=ON
          -DWAYPOINT_BUILD_RUNTIME=OFF
          -DWAYPOINT_ENABLE_RENDER=OFF
          -DWAYPOINT_ENABLE_PHYSICS=ON
          -DWAYPOINT_ENABLE_SCRIPTING=ON
          -DWAYPOINT_BUILD_TESTS=OFF

      - name: Build editor
        run: cmake --build build/editor --parallel

      - name: Upload editor artifact
        uses: actions/upload-artifact@v4
        with:
          name: waypoint-editor-${{ matrix.os }}
          path: build/editor/editor/
